name: Build Khouz Bayek Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Prepare web assets into www/
        run: npm run prepare:www

      - name: Generate Android project & sync Capacitor
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Apply Khouz Bayek Icon to Android
        run: |
          python3 - << 'PY'
          import shutil
          from pathlib import Path
          src = Path("icon-512.png")
          if src.exists():
            res = Path("android/app/src/main/res")
            for mp in res.glob("mipmap-*"):
              for fn in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                target = mp / fn
                if target.exists():
                  shutil.copyfile(src, target)
            bg = res / "values" / "ic_launcher_background.xml"
            if bg.exists():
              bg.write_text('<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#0D6857</color></resources>', encoding="utf-8")
            print("Applied Khouz Bayek icon from", src)
          PY

      - name: Configure Android permissions & Deep Link
        run: |
          node - << 'JS'
          const fs = require("fs");
          const mf = "android/app/src/main/AndroidManifest.xml";
          let xml = fs.readFileSync(mf, "utf8");
          const perms = [
            "android.permission.INTERNET",
            "android.permission.ACCESS_FINE_LOCATION",
            "android.permission.ACCESS_COARSE_LOCATION",
            "android.permission.CAMERA"
          ];
          const ins = perms.filter((p) => !xml.includes(p)).map((p) => '    <uses-permission android:name="' + p + '" />');
          if (ins.length) xml = xml.replace("<application", ins.join("\n") + "\n\n    <application");
          const deepLink = '\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="tn.kouthbayek.app" android:host="callback" />\n            </intent-filter>\n        </activity>';
          if (!xml.includes("tn.kouthbayek.app")) {
            xml = xml.replace("</activity>", deepLink);
          }
          fs.writeFileSync(mf, xml, "utf8");
          console.log("AndroidManifest.xml updated OK");
          JS

      - name: Configure fixed keystore & auto-increment versionCode
        env:
          RUN_NUM: ${{ github.run_number }}
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > android/app/kb-debug.keystore
            cp android/app/kb-debug.keystore ~/.android/debug.keystore
            echo "Fixed Khouz Bayek keystore restored OK"
          fi
          node - << 'JS'
          const fs = require("fs");
          const bf = "android/app/build.gradle";
          let g = fs.readFileSync(bf, "utf8");
          const vc = Number(process.env.RUN_NUM || 1) + 10;
          g = g.replace(/versionCode\s+\d+/, "versionCode " + vc);
          g = g.replace(/versionName\s+"[^"]+"/, 'versionName "1.3.' + process.env.RUN_NUM + '"');
          if (fs.existsSync("android/app/kb-debug.keystore") && !g.includes("kb-debug.keystore")) {
            const signCfg = '\n    signingConfigs {\n        debug {\n            storeFile file("kb-debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }\n    buildTypes {';
            g = g.replace("    buildTypes {", signCfg);
          }
          fs.writeFileSync(bf, g, "utf8");
          console.log("Updated build.gradle versionCode=" + vc);
          JS

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Khouz-Bayek.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khouz-Bayek-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
